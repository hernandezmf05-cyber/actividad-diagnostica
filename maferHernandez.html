<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Lobster&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="maferHernandez.css">
    <title>Formulario de Registro🔑</title>
</head>
<body>
    <form id="registro-form" class="formulario">
        <h1 class="titulo">Formulario de Registro🔑</h1>

        <label for="Nombre" class="etiqueta">Nombre completo:</label>
        <input type="text" id="Nombre" name="Nombre" required class="campo">

        <label for="fecha" class="etiqueta">Fecha de nacimiento:</label>
        <input type="date" id="fecha" name="fecha" required class="campo">

        <p class="subtitulo">Género</p>
        <label class="opcion"><input type="radio" name="genero" value="femenino"> Femenino</label>
        <label class="opcion"><input type="radio" name="genero" value="masculino"> Masculino</label>
        <label class="opcion"><input type="radio" name="genero" value="otro"> Otro</label>

        <label for="Correo" class="etiqueta">Correo electrónico:</label>
        <input type="email" id="Correo" name="Correo" required class="campo">

        <label for="Contraseña" class="etiqueta">Contraseña:</label>
        <input type="password" id="Contraseña" name="Contraseña" required class="campo">

        <p class="terminos">
            <label class="opcion">
                <input type="checkbox" name="terminos" required>
                Acepto términos y condiciones
            </label>
        </p>
        
        <button type="submit" class="boton">Enviar</button>
    </form>
</body>
</html>
